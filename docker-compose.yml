services:
  postgres:
    image: postgres:15-alpine
    container_name: irms-postgres
    environment:
      POSTGRES_DB: irms_db
      POSTGRES_USER: irms_user
      POSTGRES_PASSWORD: irms_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irms_user -d irms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irms-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: irms_db
      DB_USERNAME: irms_user
      DB_PASSWORD: irms_pass
      SERVER_PORT: 3000
      JWT_SECRET: change-this-secret-key-in-production-minimum-256-bits-required
      CORS_ORIGINS: http://localhost:5173,http://frontend
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: irms-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
